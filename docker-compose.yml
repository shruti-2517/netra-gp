version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: gujarat_cctv_db
    environment:
      POSTGRES_USER: cctv_admin
      POSTGRES_PASSWORD: cctv_password123
      POSTGRES_DB: gujarat_cctv_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cctv_admin -d gujarat_cctv_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
